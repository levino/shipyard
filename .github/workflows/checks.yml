name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel an in-progress CI run when a newer commit is pushed to the same ref,
# so pushes don't pile up into several full runs competing for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
      - name: Run Biome
        run: biome ci .
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # Checks the packages against the root tsconfig, then each app against its
      # own (after `astro sync` generates its content/config types).
      - run: npm run type-check
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx allow-scripts check
      - run: npm run test:unit
      # Needs no browser: asserts that a build with broken links fails.
      - run: npm run test:e2e --workspace=broken-links-test
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run in the official Playwright image: browsers + OS deps are
    # preinstalled, so there is no browser download/install step at all
    # (Playwright recommends this over installing/caching browsers in CI).
    # `--ipc=host` is required for Chromium: without it the container's tiny
    # default /dev/shm makes Chromium run out of shared memory and crash under
    # parallel workers (this is what broke the largest demo's e2e leg).
    # https://playwright.dev/docs/docker
    # The image tag cannot be bumped by Dependabot, so it drifts from
    # @playwright/test in package-lock.json. The "Install Playwright browser"
    # step below fetches the matching browser when they differ; bump the tag
    # now and then anyway to keep that step a no-op.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      matrix:
        demo:
          - name: i18n
            workspace: demo
            path: apps/demos/i18n
          - name: single-locale
            workspace: single-locale-demo
            path: apps/demos/single-locale
          - name: versioned-docs
            workspace: versioned-docs-demo
            path: apps/demos/versioned-docs
          - name: versioned-i18n
            workspace: versioned-i18n-demo
            path: apps/demos/versioned-i18n
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Full history so the demos' `git log`-based "last updated"/"last
        # author" metadata can be resolved (shallow clones have no file history).
        with:
          fetch-depth: 0
      # The job runs as root inside the container while the checkout is owned by
      # the runner user, so git refuses with "detected dubious ownership".
      # Trust the workspace so the build's `git fetch --unshallow` and `git log`
      # (used for page metadata) work.
      - run: git config --global --add safe.directory '*'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # No-op while the image matches @playwright/test; after a Playwright bump
      # it installs the browser build that version expects (plus OS deps).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run build --workspace=${{ matrix.demo.workspace }}
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./${{ matrix.demo.path }}
