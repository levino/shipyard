name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel an in-progress CI run when a newer commit is pushed to the same ref,
# so pushes don't pile up into several full runs competing for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.2.3
      - name: Run Biome
        run: biome ci .
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test --workspaces --if-present
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        demo:
          - name: i18n
            workspace: demo
            path: apps/demos/i18n
          - name: single-locale
            workspace: single-locale-demo
            path: apps/demos/single-locale
          - name: versioned-docs
            workspace: versioned-docs-demo
            path: apps/demos/versioned-docs
          - name: versioned-i18n
            workspace: versioned-i18n-demo
            path: apps/demos/versioned-i18n
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=${{ matrix.demo.workspace }}
      # Cache the Playwright browser binaries across runs, keyed on the
      # Playwright version, so Chromium isn't re-downloaded every time.
      # Bump the key when the @playwright/test version in package-lock.json
      # changes.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.57.0
      # Install only Chromium: every demo uses the `chromium` Playwright
      # project, so downloading Firefox + WebKit (as the old browser-less
      # `playwright install` did) was pure waste.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./${{ matrix.demo.path }}
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./${{ matrix.demo.path }}
