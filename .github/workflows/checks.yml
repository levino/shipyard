name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.2.3
      - name: Run Biome
        run: biome ci .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test --workspaces --if-present
  test-e2e:
    runs-on: ubuntu-latest
    # Run inside the official Playwright image, which already bundles the
    # browsers and their OS dependencies. This removes the slow
    # `npx playwright install --with-deps` step that previously ran on every
    # one of the four matrix legs and downloaded Chromium + Firefox + WebKit
    # + apt deps, even though all demos only use Chromium.
    # Keep this tag in sync with the @playwright/test version in
    # package-lock.json (currently 1.57.0).
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    strategy:
      matrix:
        demo:
          - name: i18n
            workspace: demo
            path: apps/demos/i18n
          - name: single-locale
            workspace: single-locale-demo
            path: apps/demos/single-locale
          - name: versioned-docs
            workspace: versioned-docs-demo
            path: apps/demos/versioned-docs
          - name: versioned-i18n
            workspace: versioned-i18n-demo
            path: apps/demos/versioned-i18n
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=${{ matrix.demo.workspace }}
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./${{ matrix.demo.path }}
