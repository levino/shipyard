name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: npm ci
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npx changeset publish
          github-token: ${{ steps.generate-token.outputs.token }}
        env:
          NPM_CONFIG_PROVENANCE: true

  release-candidate:
    name: Release Candidate
    needs: release
    # Snapshots are cut from pending changesets; right after a release there are none.
    if: needs.release.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: npm ci
      - name: Create RC versions
        run: npx changeset version --snapshot rc
      - name: Publish RC to npm
        run: npx changeset publish --tag rc --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: true
