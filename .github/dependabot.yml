version: 2
updates:
  # The root lockfile covers every workspace, including all demos.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
    groups:
      # Astro and its adapters/integrations are released in lockstep and rely on
      # each other's internal exports; bumping astro alone broke the Cloudflare
      # build of the server-mode demo (astro 7.3 with @astrojs/cloudflare 14.2).
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'wrangler'
      docusaurus:
        patterns:
          - '@docusaurus/*'
          - 'react'
          - 'react-dom'
          - '@mdx-js/react'
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: weekly
