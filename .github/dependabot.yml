version: 2
updates:
  # The root lockfile covers every workspace, including all demos.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
    groups:
      # Astro and its adapters/integrations are released in lockstep and rely on
      # each other's internal exports; bumping astro alone broke the Cloudflare
      # build of the server-mode demo (astro 7.3 with @astrojs/cloudflare 14.2).
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'wrangler'
      docusaurus:
        patterns:
          - '@docusaurus/*'
          - 'react'
          - 'react-dom'
          - '@mdx-js/react'
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: weekly
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
